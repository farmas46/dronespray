/* Layout: daylight catalogue. Pale ground and white sheets carry the text; machines stand cut out on white plates. Yellow marks actions and figures. */
:root{
  --ground:#eef0ec;
  --sheet:#ffffff;
  --ink:#1c1f1b;
  --muted:#565c53;
  --line:#d3d7cf;
  --plate:#ffffff;
  --yellow:#f6b70b;
  --on-yellow:#16170f;
  --ochre:#805b00;
  --pending:#8a5a12;
  --display:"Manrope",Arial,sans-serif;
  --body:"Commissioner","Segoe UI",Roboto,Arial,sans-serif;
  --model:"Inter Tight","Helvetica Neue",Arial,sans-serif;--mname:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sheet)}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.03;margin:0;text-transform:uppercase;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}

.demo{background:var(--yellow);color:var(--on-yellow);font-size:.82rem;font-weight:500;text-align:center}
.demo .wrap{padding-block:6px}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sheet);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:52px;padding-block:4px}
.masthead{background:var(--sheet)}
.masthead .wrap{display:flex;align-items:center;gap:28px;padding-block:18px}
.brand{display:block;flex:none}
.brand img{height:132px;width:auto}
.slogan{font-family:var(--mname);font-weight:300;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em;text-transform:none;max-width:12em;border-left:4px solid var(--yellow);padding-left:20px;min-width:0}
.masthead .lang{margin-left:auto;flex:none}
@media (max-width:760px){.masthead .wrap{gap:14px;padding-block:12px}.brand img{height:96px}.slogan{font-size:1.1rem;padding-left:12px;border-left-width:3px;flex:1 1 0}.masthead .lang{align-self:flex-start;margin-left:0}.masthead .lang button{min-width:32px;min-height:34px;font-size:.85rem}}
@media (max-width:440px){.masthead .wrap{flex-wrap:wrap;row-gap:4px;column-gap:16px;align-items:center}.masthead .lang{order:-1;flex:1 1 100%;justify-content:flex-end;margin-left:0}.brand img{height:104px}.slogan{order:0;flex:1 1 0;max-width:9.5em;font-size:1.3rem;line-height:1.2;padding:10px 0 10px 14px;border-left-width:4px}}
.foot-logo{height:150px;width:auto;margin-bottom:14px}
nav.main{display:flex;gap:2px}
nav.main a{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:8px 11px;color:var(--muted);border-bottom:3px solid transparent}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--yellow)}
.dd{position:relative}
.dd-btn{background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 11px}
.dd-btn:hover,.dd-btn[data-current="true"]{color:var(--ink);border-bottom-color:var(--yellow)}
.dd-menu{display:none;position:absolute;top:100%;left:0;width:min(780px,calc(100vw - 48px));background:var(--sheet);border:1px solid var(--line);box-shadow:0 18px 36px rgba(28,31,27,.16);z-index:70;padding:18px}
.dd:focus-within .dd-menu,.dd[data-open="true"] .dd-menu{display:block}
.mega{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

nav.main .mega-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 8px;border:0;text-align:center;font-size:.82rem;letter-spacing:.04em;white-space:normal;color:var(--ink)}
.mega-item img{height:96px;width:100%;object-fit:contain;transition:transform .2s}

.mega-item:hover img{transform:translateY(-4px)}
nav.main .mega-all{display:block;margin-top:12px;padding:14px 4px 2px;border-top:1px solid var(--line);border-bottom:0;color:var(--ochre)}

.soon-box{background:var(--ground);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:46rem}
.soon-box h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.soon-box p{color:var(--muted)}
.p-hero h1.long{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05}
.lang{display:flex;align-items:center;gap:2px}
.lang .sep{width:1px;height:14px;background:var(--line)}
.lang button{position:relative;background:none;border:0;color:#8b9086;font-family:"Manrope",Arial,sans-serif;font-weight:700;font-size:.92rem;letter-spacing:.08em;min-height:40px;min-width:40px;padding:0 8px;cursor:pointer;transition:color .2s}
.lang button:hover{color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.lang button[aria-pressed="true"]{color:var(--ink)}
.lang button[aria-pressed="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:6px;height:3px;background:var(--yellow)}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);width:44px;height:42px;cursor:pointer;padding:0;align-items:center;justify-content:center}
.menu svg{width:22px;height:22px}
@media (max-width:860px){
  .menu{display:none}
  header.site .wrap{min-height:0;padding-block:0}
  nav.main,nav.main[data-open="false"]{display:flex;flex-wrap:wrap;width:100%;gap:0 2px;padding-block:4px}
  .dd{display:flex}
  nav.main a,.dd-btn{flex:none;white-space:nowrap;padding:9px 7px;font-size:.8rem;letter-spacing:.04em;line-height:1.3}
  .dd{position:static}
  .dd-menu{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;padding:12px}
  .mega{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .mega-item img{height:70px}
  nav.main .mega-item{font-size:.72rem;padding:8px 4px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mname);font-weight:600;font-size:1rem;letter-spacing:0;text-transform:none;text-decoration:none;text-align:center;padding:13px 22px;border-radius:8px;border:1px solid var(--yellow);background:var(--yellow);color:var(--on-yellow);cursor:pointer;transition:background .15s,border-color .15s}

.btn.ghost:hover{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

.hero{background:var(--sheet);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;padding-block:40px}
.hero-copy{display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(2.2rem,4.5vw,3.9rem);line-height:1.08}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.plate{background:var(--plate);display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate.light{background:var(--plate)}
.plate:not(.light) img{filter:drop-shadow(0 10px 12px rgba(28,31,27,.16))}
.hero .plate img{width:auto;height:auto;max-height:540px;object-fit:contain}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:20px 32px;gap:24px}.hero .plate,.hs{order:-1}.hs{height:330px}}

section.band{padding-block:64px}
section.band.white{background:var(--sheet);border-block:1px solid var(--line)}

.head{display:flex;flex-direction:column;gap:10px;max-width:46rem;margin-bottom:32px}
.head h2,.head h1{font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1.12}
.head p{color:var(--muted);font-size:1.05rem}
.cmp-h .mdl{font-family:var(--mname);font-weight:400;letter-spacing:0}
/*pz*/

.cc-chips{display:flex;flex-wrap:wrap;gap:5px}
.cc-chips button{all:unset;cursor:pointer;flex:none;padding:6px 10px;border-radius:7px;border:1px solid #c9ccc4;background:#fff;font-size:.76rem;font-weight:500;color:#1c1f1b;transition:background .2s,color .2s,border-color .2s}

.nws{background:#f3f4f0}
.nws-list{display:grid;gap:20px}
.nws-card{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:center;background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.nws-pic{all:unset;box-sizing:border-box;display:block;border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:9/12;background:#e9ebe5}
.nws-pic img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.nws-pic:hover img{transform:scale(1.04)}
.nws-pic:focus-visible{outline:3px solid #1c1f1b;outline-offset:3px}
.nws-date{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre,#8a6400);font-weight:600}
.nws-body h3{font-family:var(--mname);font-weight:400;text-transform:none;letter-spacing:-.01em;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.12;margin:10px 0 14px}

.nws-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.phg{background:#fff}

includes:'Βασικός εξοπλισμός',intro:{pm20:"Το μηχάνημα External Pre-Mixer 20 L είναι αυτόνομη μονάδα προετοιμασίας ψεκαστικού υγρού. Με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 60 L/min, τα σκευάσματα διαλύονται γρήγορα, οι φιάλες των σκευασμάτων ξεπλένονται επιτόπου και το έτοιμο μίγμα μεταφέρεται στο κύριο σύστημα, καθαρά και με ασφάλεια.",ds400:"Το DS400 έχει δεξαμενή πολυαιθυλενίου 400 λίτρων πάνω σε μεταλλικό πάνελ, με όλα τα χειριστήρια, τη μάνικα και το πιστόλι πλήρωσης συγκεντρωμένα σε μία συμπαγή μονάδα, καθώς και θήκη μπαταρίας στο πλάι.",ds500:"Το DS500 συνδυάζει δεξαμενή πολυαιθυλενίου 500 λίτρων με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Πιο κοντό και φαρδύ από το DS600, με όλα τα χειριστήρια συγκεντρωμένα σε μεταλλικό πάνελ και θήκη μπαταρίας στο πλάι.",ds110:"Το DS110 της σειράς Cone είναι η πιο μικρή και ευέλικτη μονάδα της σειράς: κωνική δεξαμενή πολυαιθυλενίου 110 λίτρων πάνω σε μεταλλική βάση, με μεμβρανοφόρα αντλία 12 V και παροχή έως 19 L/min. Λειτουργεί από μπαταρία 12 V, χωρίς να χρειάζεται ρεύμα 220 V στο χωράφι.",ds300:'Το DS300 έχει δεξαμενή πολυαιθυλενίου 300 λίτρων πάνω σε μεταλλικό πάνελ, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Όλα τα χειριστήρια, το κουτί αποθήκευσης και η μάνικα πλήρωσης 3/4" είναι μαζεμένα σε μία συμπαγή μονάδα.',ds200:'Το DS200 έχει δεξαμενή πολυαιθυλενίου 200 λίτρων στο ίδιο συμπαγές πάνελ με το DS300, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Ιδανικό για μικρότερα drone και καθημερινή χρήση.',ds200c:'Το DS200 της σειράς Cone έχει κωνική δεξαμενή πολυαιθυλενίου 200 λίτρων πάνω σε μεταλλική βάση, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Με βάρος μόλις 50 kg είναι η πιο ελαφριά μονάδα της σειράς.',ds600:'Το DS600 συνδυάζει δεξαμενή πολυαιθυλενίου 600 λίτρων με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Όλα τα χειριστήρια βρίσκονται σε ένα μεταλλικό πάνελ, με τη μάνικα 3/4" και το πιστόλι πλήρωσης στο πλάι.',ds420:'Το DS420 της σειράς Cone έχει κωνική δεξαμενή πολυαιθυλενίου 420 λίτρων πάνω σε μεταλλική βάση, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Με βάρος 80 kg είναι η πιο ελαφριά από τις δύο μονάδες με πλήρη στοιχεία.'},

includes:'Standard equipment',intro:{pm20:"The External Pre-Mixer 20 L is a standalone unit for preparing spray solution. With a 1 HP stainless centrifugal pump and flow up to 60 L/min, products dissolve quickly, containers are rinsed on the spot and the finished mix is transferred to the main system, cleanly and safely.",ds400:"The DS400 has a 400 litre polyethylene tank on a metal panel, with all controls, the hose and the filling gun grouped in one compact unit, plus a battery box on the side.",ds500:"The DS500 combines a 500 litre polyethylene tank with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Shorter and wider than the DS600, with all controls grouped on a metal panel and a battery box on the side.",ds110:"The DS110 from the Cone series is the smallest and most flexible unit in the range: a 110-litre conical polyethylene tank on a metal base, with a 12 V diaphragm pump and flow up to 19 L/min. It runs from a 12 V battery, with no need for 220 V power in the field.",ds300:'The DS300 has a 300-litre polyethylene tank on a metal panel, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Controls, storage box and filling hose are all grouped in one compact unit.',ds200:'The DS200 has a 200-litre polyethylene tank on the same compact panel as the DS300, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Ideal for smaller drones and everyday use.',ds200c:'The DS200 from the Cone series has a 200-litre conical polyethylene tank on a metal base, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. At just 50 kg it is the lightest unit in the range.',ds600:'The DS600 combines a 600-litre polyethylene tank with a 1 HP stainless centrifugal pump and flow up to 80 L/min. All controls sit on one metal panel, with the hose and filling gun at the side.',ds420:'The DS420 from the Cone series has a 420-litre conical polyethylene tank on a metal base, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. At 80 kg it is the lighter of the two fully specified units.'},

includes:'Equipamiento de serie',intro:{pm20:"El External Pre-Mixer 20 L es una unidad autónoma para preparar el caldo de pulverización. Con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 60 L/min, los productos se disuelven con rapidez, los envases se enjuagan in situ y la mezcla lista se transfiere al sistema principal de forma limpia y segura.",ds400:"El DS400 cuenta con un depósito de polietileno de 400 litros sobre un panel metálico, con todos los mandos, la manguera y la pistola de llenado reunidos en una unidad compacta, además de una caja de batería en el lateral.",ds500:"El DS500 combina un depósito de polietileno de 500 litros con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 80 L/min. Más corto y ancho que el DS600, con todos los mandos agrupados en un panel metálico y una caja de batería en el lateral.",ds110:"El DS110 de la serie Cone es el equipo más pequeño y versátil de la gama: depósito cónico de polietileno de 110 litros sobre base metálica, con bomba de membrana de 12 V y caudal de hasta 19 L/min. Funciona con batería de 12 V, sin necesidad de corriente de 220 V en el campo.",ds300:'El DS300 tiene un depósito de polietileno de 300 litros sobre un panel metálico, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Mandos, caja de almacenaje y manguera de llenado reunidos en una unidad compacta.',ds200:'El DS200 tiene un depósito de polietileno de 200 litros en el mismo panel compacto que el DS300, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Ideal para drones más pequeños y uso diario.',ds200c:'El DS200 de la serie Cone tiene un depósito cónico de polietileno de 200 litros sobre base metálica, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Con solo 50 kg es el equipo más ligero de la gama.',ds600:'El DS600 combina un depósito de polietileno de 600 litros con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 80 L/min. Todos los mandos están en un panel metálico, con la manguera y la pistola de llenado en el lateral.',ds420:'El DS420 de la serie Cone tiene un depósito cónico de polietileno de 420 litros sobre base metálica, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Con 80 kg es el más ligero de los dos equipos con datos completos.'},

includes:'Equipaggiamento di serie',intro:{pm20:"L’External Pre-Mixer 20 L è un’unità autonoma per la preparazione della miscela da irrorare. Con una pompa centrifuga inox da 1 HP e una portata fino a 60 L/min, i prodotti si sciolgono rapidamente, i flaconi si lavano sul posto e la miscela pronta viene trasferita al sistema principale in modo pulito e sicuro.",ds400:"Il DS400 ha un serbatoio in polietilene da 400 litri su un pannello metallico, con tutti i comandi, la manichetta e la pistola di riempimento riuniti in un’unica unità compatta, oltre a un vano batteria laterale.",ds500:"Il DS500 abbina un serbatoio in polietilene da 500 litri a una pompa centrifuga inox da 1 HP con portata fino a 80 L/min. Più corto e più largo del DS600, con tutti i comandi raccolti su un pannello metallico e un vano batteria laterale.",ds110:"Il DS110 della serie Cone è l’unità più piccola e versatile della gamma: serbatoio conico in polietilene da 110 litri su base metallica, con pompa a membrana a 12 V e portata fino a 19 L/min. Funziona con batteria a 12 V, senza bisogno di corrente a 220 V in campo.",ds300:'Il DS300 ha un serbatoio in polietilene da 300 litri su un pannello metallico, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Comandi, vano portaoggetti e tubo di riempimento sono riuniti in un’unica unità compatta.',ds200:'Il DS200 ha un serbatoio in polietilene da 200 litri sullo stesso pannello compatto del DS300, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Ideale per droni più piccoli e uso quotidiano.',ds200c:'Il DS200 della serie Cone ha un serbatoio conico in polietilene da 200 litri su base metallica, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Con soli 50 kg è l’unità più leggera della gamma.',ds600:'Il DS600 unisce un serbatoio in polietilene da 600 litri a una pompa centrifuga inox da 1 HP, con portata fino a 80 L/min. Tutti i comandi sono su un unico pannello metallico, con tubo e pistola di riempimento sul lato.',ds420:'Il DS420 della serie Cone ha un serbatoio conico in polietilene da 420 litri su base metallica, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Con 80 kg è la più leggera delle due unità con dati completi.'},

const PRIV={"el": {"title": "Πολιτική απορρήτου", "upd": "Τελευταία ενημέρωση: Νοέμβριος 2026", "intro": "Η παρούσα πολιτική εξηγεί ποια προσωπικά δεδομένα συλλέγουμε μέσω της ιστοσελίδας DroneSpray, για ποιο σκοπό, πόσο καιρό τα κρατάμε και ποια δικαιώματα έχετε σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (ΕΕ) 2016/679 (GDPR).", "s": [["Υπεύθυνος επεξεργασίας", ["FARMA Κυράτσας Γεωργικά Μηχανήματα Ε.Ε., 3ο χλμ. Λάρισας – Καρδίτσας, 41500 Λάρισα. Τηλέφωνο: 2410 622500 · Email: info@farma.com.gr."]], ["Ποια δεδομένα συλλέγουμε", ["Φόρμα επικοινωνίας: ονοματεπώνυμο, επιχείρηση, χώρα, τηλέφωνο, email, προϊόν ενδιαφέροντος και το μήνυμά σας.", "Αίτηση dealer: τα παραπάνω, καθώς και περιοχή, τύπος επιχείρησης και ιστοσελίδα (προαιρετικά).", "Newsletter: η διεύθυνση email σας και η συγκατάθεσή σας.", "WhatsApp: αν μας γράψετε μέσω WhatsApp, την επικοινωνία διαχειρίζεται η WhatsApp (Meta) σύμφωνα με τους δικούς της όρους."]], ["Για ποιο σκοπό και με ποια νομική βάση", ["Για να απαντήσουμε στο αίτημά σας, να σας στείλουμε προσφορά ή να οργανώσουμε επίδειξη (ενέργειες πριν από τη σύναψη σύμβασης, άρθρο 6 παρ. 1 β' GDPR).", "Για την αξιολόγηση αιτήσεων συνεργασίας (έννομο συμφέρον, άρθρο 6 παρ. 1 στ').", "Για την αποστολή newsletter, μόνο με τη συγκατάθεσή σας (άρθρο 6 παρ. 1 α'), την οποία μπορείτε να ανακαλέσετε οποτεδήποτε.", "Για στατιστικά επισκεψιμότητας μέσω Google Analytics, μόνο αν το αποδεχτείτε στο σχετικό μήνυμα (άρθρο 6 παρ. 1 α')."]], ["Πόσο καιρό κρατάμε τα δεδομένα", ["Τα αιτήματα επικοινωνίας και οι αιτήσεις dealer διατηρούνται έως 24 μήνες από την τελευταία επικοινωνία, εκτός αν προκύψει συνεργασία, οπότε ισχύουν οι νόμιμες υποχρεώσεις τήρησης.", "Το email του newsletter διατηρείται μέχρι να διαγραφείτε."]], ["Σε ποιους κοινοποιούνται", ["Δεν πουλάμε και δεν μεταβιβάζουμε τα δεδομένα σας σε τρίτους για διαφημιστικούς σκοπούς.", "Μπορεί να τα επεξεργάζονται για λογαριασμό μας πάροχοι φιλοξενίας, email και newsletter, δεσμευμένοι με σύμβαση επεξεργασίας.", "Αν ζητήσετε συνεργάτη στη χώρα σας, θα του διαβιβάσουμε τα στοιχεία επικοινωνίας σας μόνο για να σας εξυπηρετήσει.", "Αν αποδεχτείτε τα cookies στατιστικών, δεδομένα χρήσης της σελίδας επεξεργάζεται η Google Ireland Ltd (Google Analytics). Ενδέχεται να διαβιβαστούν στις ΗΠΑ, βάσει του Πλαισίου Προστασίας Δεδομένων ΕΕ–ΗΠΑ."]], ["Cookies", ["Η ιστοσελίδα δεν χρησιμοποιεί cookies διαφήμισης.", "Στη συσκευή σας αποθηκεύονται τοπικά η γλώσσα που επιλέξατε και η απάντησή σας στο μήνυμα για τα cookies.", "Μόνο αν πατήσετε «Αποδοχή», φορτώνεται το Google Tag Manager και μέσω αυτού το Google Analytics 4, που καταγράφει ανώνυμα στατιστικά, όπως σελίδες που επισκεφθήκατε, τύπο συσκευής και κατά προσέγγιση χώρα. Χρησιμοποιεί τα cookies _ga και _ga_*, που διατηρούνται έως 2 έτη. Αν πατήσετε «Απόρριψη», δεν φορτώνεται καθόλου.", "Μπορείτε να αλλάξετε την επιλογή σας οποτεδήποτε από τον σύνδεσμο «Ρυθμίσεις cookies» στο κάτω μέρος της σελίδας.", "Οι γραμματοσειρές φιλοξενούνται μαζί με την ιστοσελίδα· δεν γίνεται σύνδεση με το Google Fonts."]], ["Τα δικαιώματά σας", ["Έχετε δικαίωμα πρόσβασης, διόρθωσης, διαγραφής, περιορισμού, φορητότητας και εναντίωσης στην επεξεργασία, καθώς και ανάκλησης της συγκατάθεσής σας.", "Για να τα ασκήσετε, γράψτε μας στο info@farma.com.gr. Θα απαντήσουμε εντός ενός μηνός.", "Έχετε επίσης δικαίωμα να υποβάλετε καταγγελία στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (www.dpa.gr)."]], ["Ασφάλεια", ["Λαμβάνουμε εύλογα τεχνικά και οργανωτικά μέτρα για την προστασία των δεδομένων σας από απώλεια, κατάχρηση ή μη εξουσιοδοτημένη πρόσβαση."]], ["Αλλαγές", ["Μπορεί να ενημερώνουμε την πολιτική αυτή. Η ισχύουσα έκδοση είναι πάντα δημοσιευμένη σε αυτή τη σελίδα."]]]}, "en": {"title": "Privacy policy", "upd": "Last updated: November 2026", "intro": "This policy explains what personal data we collect through the DroneSpray website, why, how long we keep it and what rights you have under the General Data Protection Regulation (EU) 2016/679 (GDPR).", "s": [["Data controller", ["FARMA Kyratsas Agricultural Machinery L.P., 3rd km Larissa – Karditsa road, 41500 Larissa, Greece. Phone: +30 2410 622500 · Email: info@farma.com.gr."]], ["What data we collect", ["Contact form: full name, company, country, phone, email, product of interest and your message.", "Dealer application: the above, plus region, type of business and website (optional).", "Newsletter: your email address and your consent.", "WhatsApp: if you message us on WhatsApp, the conversation is handled by WhatsApp (Meta) under its own terms."]], ["Purpose and legal basis", ["To answer your request, send you a quote or arrange a demonstration (steps prior to a contract, Art. 6(1)(b) GDPR).", "To assess partnership applications (legitimate interest, Art. 6(1)(f)).", "To send the newsletter, only with your consent (Art. 6(1)(a)), which you can withdraw at any time.", "For visitor statistics through Google Analytics, only if you accept it in the cookie notice (Art. 6(1)(a))."]], ["How long we keep data", ["Contact requests and dealer applications are kept for up to 24 months after the last contact, unless a business relationship follows, in which case statutory retention periods apply.", "Your newsletter email is kept until you unsubscribe."]], ["Who we share it with", ["We do not sell or transfer your data to third parties for advertising.", "Hosting, email and newsletter providers may process it on our behalf under a data processing agreement.", "If you ask for a partner in your country, we pass your contact details to that partner only so they can serve you.", "If you accept statistics cookies, usage data is processed by Google Ireland Ltd (Google Analytics). It may be transferred to the USA under the EU–US Data Privacy Framework."]], ["Cookies", ["The website does not use advertising cookies.", "Your chosen language and your answer to the cookie notice are stored locally on your device.", "Only if you click “Accept” are Google Tag Manager and, through it, Google Analytics 4 loaded. Analytics records anonymous statistics such as pages visited, device type and approximate country, using the _ga and _ga_* cookies, which last up to 2 years. If you click “Decline”, it is not loaded at all.", "You can change your choice at any time with the “Cookie settings” link at the bottom of the page.", "Fonts are hosted together with the website; no connection is made to Google Fonts."]], ["Your rights", ["You have the right of access, rectification, erasure, restriction, portability and objection, and to withdraw your consent.", "To exercise them, email info@farma.com.gr. We will reply within one month.", "You may also lodge a complaint with the Hellenic Data Protection Authority (www.dpa.gr) or your local supervisory authority."]], ["Security", ["We take reasonable technical and organisational measures to protect your data against loss, misuse or unauthorised access."]], ["Changes", ["We may update this policy. The current version is always published on this page."]]]}};
