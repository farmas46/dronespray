/* Layout: daylight catalogue. Pale ground and white sheets carry the text; machines stand cut out on white plates. Yellow marks actions and figures. */
:root{
  --ground:#eef0ec;
  --sheet:#ffffff;
  --ink:#1c1f1b;
  --muted:#565c53;
  --line:#d3d7cf;
  --plate:#ffffff;
  --yellow:#f6b70b;
  --on-yellow:#16170f;
  --ochre:#805b00;
  --pending:#8a5a12;
  --display:"Manrope",Arial,sans-serif;
  --body:"Commissioner","Segoe UI",Roboto,Arial,sans-serif;
  --model:"Inter Tight","Helvetica Neue",Arial,sans-serif;--mname:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sheet)}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.03;margin:0;text-transform:uppercase;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}

.demo{background:var(--yellow);color:var(--on-yellow);font-size:.82rem;font-weight:500;text-align:center}
.demo .wrap{padding-block:6px}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sheet);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:52px;padding-block:4px}
.masthead{background:var(--sheet)}
.masthead .wrap{display:flex;align-items:center;gap:28px;padding-block:18px}
.brand{display:block;flex:none}
.brand img{height:132px;width:auto}
.slogan{font-family:var(--mname);font-weight:300;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em;text-transform:none;max-width:12em;border-left:4px solid var(--yellow);padding-left:20px;min-width:0}
.masthead .lang{margin-left:auto;flex:none}
@media (max-width:760px){.masthead .wrap{gap:14px;padding-block:12px}.brand img{height:96px}.slogan{font-size:1.1rem;padding-left:12px;border-left-width:3px;flex:1 1 0}.masthead .lang{align-self:flex-start;margin-left:0}.masthead .lang button{min-width:32px;min-height:34px;font-size:.85rem}}
@media (max-width:440px){.masthead .wrap{flex-wrap:wrap;row-gap:4px;column-gap:16px;align-items:center}.masthead .lang{order:-1;flex:1 1 100%;justify-content:flex-end;margin-left:0}.brand img{height:104px}.slogan{order:0;flex:1 1 0;max-width:9.5em;font-size:1.3rem;line-height:1.2;padding:10px 0 10px 14px;border-left-width:4px}}
.foot-logo{height:150px;width:auto;margin-bottom:14px}
nav.main{display:flex;gap:2px}
nav.main a{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:8px 11px;color:var(--muted);border-bottom:3px solid transparent}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--yellow)}
.dd{position:relative}
.dd-btn{background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 11px}
.dd-btn:hover,.dd-btn[data-current="true"]{color:var(--ink);border-bottom-color:var(--yellow)}
.dd-menu{display:none;position:absolute;top:100%;left:0;width:min(780px,calc(100vw - 48px));background:var(--sheet);border:1px solid var(--line);box-shadow:0 18px 36px rgba(28,31,27,.16);z-index:70;padding:18px}
.dd:focus-within .dd-menu,.dd[data-open="true"] .dd-menu{display:block}
.mega{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:1000px) and (min-width:861px){.mega{grid-template-columns:repeat(3,minmax(0,1fr))}}
nav.main .mega-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 8px;border:0;text-align:center;font-size:.82rem;letter-spacing:.04em;white-space:normal;color:var(--ink)}
.mega-item img{height:96px;width:100%;object-fit:contain;transition:transform .2s}
nav.main .mega-item:hover,nav.main .mega-item[aria-current="page"]{background:var(--ground);border:0}
.mega-item:hover img{transform:translateY(-4px)}
nav.main .mega-all{display:block;margin-top:12px;padding:14px 4px 2px;border-top:1px solid var(--line);border-bottom:0;color:var(--ochre)}
nav.main .mega-all:hover{color:var(--ink);border-bottom:0}
.soon-box{background:var(--ground);border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:46rem}
.soon-box h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.soon-box p{color:var(--muted)}
.p-hero h1.long{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05}
.lang{display:flex;align-items:center;gap:2px}
.lang .sep{width:1px;height:14px;background:var(--line)}
.lang button{position:relative;background:none;border:0;color:#8b9086;font-family:"Manrope",Arial,sans-serif;font-weight:700;font-size:.92rem;letter-spacing:.08em;min-height:40px;min-width:40px;padding:0 8px;cursor:pointer;transition:color .2s}
.lang button:hover{color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.lang button[aria-pressed="true"]{color:var(--ink)}
.lang button[aria-pressed="true"]::after{content:"";position:absolute;left:9px;right:9px;bottom:6px;height:3px;background:var(--yellow)}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);width:44px;height:42px;cursor:pointer;padding:0;align-items:center;justify-content:center}
.menu svg{width:22px;height:22px}
@media (max-width:860px){
  .menu{display:none}
  header.site .wrap{min-height:0;padding-block:0}
  nav.main,nav.main[data-open="false"]{display:flex;flex-wrap:wrap;width:100%;gap:0 2px;padding-block:4px}
  .dd{display:flex}
  nav.main a,.dd-btn{flex:none;white-space:nowrap;padding:9px 7px;font-size:.8rem;letter-spacing:.04em;line-height:1.3}
  .dd{position:static}
  .dd-menu{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;padding:12px}
  .mega{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .mega-item img{height:70px}
  nav.main .mega-item{font-size:.72rem;padding:8px 4px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mname);font-weight:600;font-size:1rem;letter-spacing:0;text-transform:none;text-decoration:none;text-align:center;padding:13px 22px;border-radius:8px;border:1px solid var(--yellow);background:var(--yellow);color:var(--on-yellow);cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#ffcb3a;border-color:#ffcb3a}
.btn.ghost{background:#fff;border-color:#b9bdb3;color:var(--ink)}
.btn.ghost:hover{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

.hero{background:var(--sheet);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;padding-block:40px}
.hero-copy{display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(2.2rem,4.5vw,3.9rem);line-height:1.08}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.plate{background:var(--plate);display:flex;align-items:center;justify-content:center;overflow:hidden}
.plate.light{background:var(--plate)}
.plate:not(.light) img{filter:drop-shadow(0 10px 12px rgba(28,31,27,.16))}
.hero .plate img{width:auto;height:auto;max-height:540px;object-fit:contain}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:20px 32px;gap:24px}.hero .plate,.hs{order:-1}.hs{height:330px}}

section.band{padding-block:64px}
section.band.white{background:var(--sheet);border-block:1px solid var(--line)}
@media (max-width:600px){section.band{padding-block:44px}}
.head{display:flex;flex-direction:column;gap:10px;max-width:46rem;margin-bottom:32px}
.head h2,.head h1{font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1.12}
.head p{color:var(--muted);font-size:1.05rem}
.cmp-h .mdl{font-family:var(--mname);font-weight:400;letter-spacing:0}
/*pz*/

.cc-chips{display:flex;flex-wrap:wrap;gap:5px}
.cc-chips button{all:unset;cursor:pointer;flex:none;padding:6px 10px;border-radius:7px;border:1px solid #c9ccc4;background:#fff;font-size:.76rem;font-weight:500;color:#1c1f1b;transition:background .2s,color .2s,border-color .2s}
.cc-chips button:hover{border-color:#1c1f1b}
.cc-chips button[aria-pressed=true]{background:#1c1f1b;border-color:#1c1f1b;color:#fff}
.cc-chips button:focus-visible{outline:2px solid #f6b70b;outline-offset:2px}
.cc-name{font-family:var(--mname);font-weight:300;text-transform:none;letter-spacing:-.01em;font-size:2.2rem;line-height:1;margin:0}
.cc-b li{border-bottom-color:#dfe1da}
.cc-go{margin-top:16px;align-self:flex-start;background:#f6b70b;color:#1c1f1b;text-decoration:none;font-weight:600;font-size:.92rem;padding:11px 20px;border-radius:8px;transition:background .2s}
.cc-go:hover{background:#ffcb3a}
.cc .cc-img{height:200px}
@media (max-width:600px){.cc{padding:14px 12px 18px}.cc-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px}.cc-chips::-webkit-scrollbar{display:none}.cc-chips button{padding:6px 9px;font-size:.72rem}.cc-name{font-size:1.5rem}.cc .cc-img{height:110px}.cc-go{font-size:.8rem;padding:9px 12px}}

.nws{background:#f3f4f0}
.nws-list{display:grid;gap:20px}
.nws-card{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:center;background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.nws-pic{all:unset;box-sizing:border-box;display:block;border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:9/12;background:#e9ebe5}
.nws-pic img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.nws-pic:hover img{transform:scale(1.04)}
.nws-pic:focus-visible{outline:3px solid #1c1f1b;outline-offset:3px}
.nws-date{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre,#8a6400);font-weight:600}
.nws-body h3{font-family:var(--mname);font-weight:400;text-transform:none;letter-spacing:-.01em;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.12;margin:10px 0 14px}
.nws-body p{color:#5d6359;line-height:1.6;margin:0;max-width:40em}
.nws-tag{display:inline-block;margin-top:16px;background:#f6b70b;color:#1c1f1b;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:6px}
.nws-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media (max-width:760px){.nws-card{grid-template-columns:minmax(0,1fr);gap:18px;padding:14px}.nws-pic{aspect-ratio:4/3}.nws-btns .btn{flex:1 1 100%}}

.phg{background:#fff}
.phg-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.phg-rail::-webkit-scrollbar{display:none}
.phg-item{all:unset;box-sizing:border-box;flex:0 0 64%;scroll-snap-align:start;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#e9ebe5}
.phg-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.phg-item:hover img{transform:scale(1.04)}
.phg-item:focus-visible{outline:3px solid #1c1f1b;outline-offset:3px}
.box-nav{display:none;position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.92);color:#1c1f1b;box-shadow:0 4px 16px rgba(0,0,0,.18);place-items:center;cursor:pointer;transition:background .2s}
.box-nav:hover{background:#f6b70b}

.box-count{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:2;font-family:Manrope,Arial,sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.04em;color:#fff;background:rgba(28,31,27,.6);padding:4px 12px;border-radius:999px;pointer-events:none}.box-count:empty{display:none}

.pzt-tags span.new{background:#1c1f1b;color:#fff}
.crumbs{font-size:.85rem;color:#5d6359;margin-bottom:22px}.crumbs a{color:inherit}
.accd-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:center}

.accd-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

.acc-t-btn{align-self:flex-start;margin-top:14px;padding:8px 16px;border-radius:8px;border:1px solid #b9bdb3;font-size:.82rem;font-weight:600;transition:background .2s,color .2s,border-color .2s}

.why-lead2{color:var(--muted);max-width:44em;margin:0}
.why-photo{margin:0 auto;max-width:1180px;padding:0 max(16px,env(safe-area-inset-left,0px))}
.why-photo img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 45%;border-radius:16px}
.why-feats{padding:64px 0}
.why-feats h2{font-size:clamp(1.5rem,2.8vw,2.2rem);line-height:1.1;margin:0 0 30px}
.why-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.why-card{background:var(--sheet);border-radius:16px;padding:26px 24px 24px;display:flex;flex-direction:column;gap:14px}
.why-card>div{display:flex;flex-direction:column;gap:8px}
.why-ic{width:52px;height:52px;border-radius:14px;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;flex:none}
.why-ic svg{width:28px;height:28px}
.why-num{font-family:var(--mname);font-weight:300;font-size:.9rem;color:#9a9f94}
.why-card h3{margin:0;font-size:1.08rem;line-height:1.25}
.why-card p{margin:0;color:var(--muted)}
.why-card.wide{grid-column:1/-1;flex-direction:row;align-items:flex-start;gap:22px;box-shadow:inset 4px 0 0 var(--yellow)}
.why-card.wide p{max-width:60em}
.why-close{background:var(--ink);color:#fff;padding:64px 0}
.why-close .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.why-close .eyebrow{color:var(--yellow)}
.why-close h2{font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.1;margin:10px 0 16px;color:#fff}
.why-close p{color:#c9ccc4;margin:0 0 14px}
.why-tri{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.5;color:#fff!important;margin:18px 0 24px!important}
.why-tri span{display:block}
.why-tri span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);margin-right:12px;vertical-align:middle}
.why-close .btn.ghost{background:none;color:#fff;border-color:#5a5f56}
.why-img img{display:block;width:100%;border-radius:16px;aspect-ratio:4/3;object-fit:cover}
.why-slogan{background:var(--yellow);color:var(--on-yellow);text-align:center;padding:26px 16px;font-family:var(--display);font-weight:800;font-size:clamp(1rem,2vw,1.35rem);line-height:1.3;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:860px){.why-close .wrap{grid-template-columns:minmax(0,1fr)}.why-hero{padding:36px 0 32px}.why-feats,.why-close{padding:44px 0}}
@media (max-width:600px){.why-card.wide{flex-direction:column}}

/* Field video */
.vid-frame{width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#1c1f1b;box-shadow:0 30px 60px -30px rgba(28,31,27,.45)}
.vid-frame video{width:100%;height:100%;object-fit:cover;display:block}

.vid-fig{margin:0;display:flex;flex-direction:column;gap:14px}
.vid-fig .vid-frame{width:100%}
.vid-fig figcaption{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.vid-cta{display:flex;justify-content:center;margin-top:32px}

.vid-car{margin-top:0}
.vid-rail{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px}

includes:'Βασικός εξοπλισμός',intro:{pm20:"Το μηχάνημα External Pre-Mixer 20 L είναι αυτόνομη μονάδα προετοιμασίας ψεκαστικού υγρού. Με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 60 L/min, τα σκευάσματα διαλύονται γρήγορα, οι φιάλες των σκευασμάτων ξεπλένονται επιτόπου και το έτοιμο μίγμα μεταφέρεται στο κύριο σύστημα, καθαρά και με ασφάλεια.",ds400:"Το DS400 έχει δεξαμενή πολυαιθυλενίου 400 λίτρων πάνω σε μεταλλικό πάνελ, με όλα τα χειριστήρια, τη μάνικα και το πιστόλι πλήρωσης συγκεντρωμένα σε μία συμπαγή μονάδα, καθώς και θήκη μπαταρίας στο πλάι.",ds500:"Το DS500 συνδυάζει δεξαμενή πολυαιθυλενίου 500 λίτρων με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Πιο κοντό και φαρδύ από το DS600, με όλα τα χειριστήρια συγκεντρωμένα σε μεταλλικό πάνελ και θήκη μπαταρίας στο πλάι.",ds110:"Το DS110 της σειράς Cone είναι η πιο μικρή και ευέλικτη μονάδα της σειράς: κωνική δεξαμενή πολυαιθυλενίου 110 λίτρων πάνω σε μεταλλική βάση, με μεμβρανοφόρα αντλία 12 V και παροχή έως 19 L/min. Λειτουργεί από μπαταρία 12 V, χωρίς να χρειάζεται ρεύμα 220 V στο χωράφι.",ds300:'Το DS300 έχει δεξαμενή πολυαιθυλενίου 300 λίτρων πάνω σε μεταλλικό πάνελ, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Όλα τα χειριστήρια, το κουτί αποθήκευσης και η μάνικα πλήρωσης 3/4" είναι μαζεμένα σε μία συμπαγή μονάδα.',ds200:'Το DS200 έχει δεξαμενή πολυαιθυλενίου 200 λίτρων στο ίδιο συμπαγές πάνελ με το DS300, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Ιδανικό για μικρότερα drone και καθημερινή χρήση.',ds200c:'Το DS200 της σειράς Cone έχει κωνική δεξαμενή πολυαιθυλενίου 200 λίτρων πάνω σε μεταλλική βάση, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Με βάρος μόλις 50 kg είναι η πιο ελαφριά μονάδα της σειράς.',ds600:'Το DS600 συνδυάζει δεξαμενή πολυαιθυλενίου 600 λίτρων με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Όλα τα χειριστήρια βρίσκονται σε ένα μεταλλικό πάνελ, με τη μάνικα 3/4" και το πιστόλι πλήρωσης στο πλάι.',ds420:'Το DS420 της σειράς Cone έχει κωνική δεξαμενή πολυαιθυλενίου 420 λίτρων πάνω σε μεταλλική βάση, με ανοξείδωτη φυγοκεντρική αντλία 1 HP και παροχή έως 80 L/min. Με βάρος 80 kg είναι η πιο ελαφριά από τις δύο μονάδες με πλήρη στοιχεία.'},

includes:'Standard equipment',intro:{pm20:"The External Pre-Mixer 20 L is a standalone unit for preparing spray solution. With a 1 HP stainless centrifugal pump and flow up to 60 L/min, products dissolve quickly, containers are rinsed on the spot and the finished mix is transferred to the main system, cleanly and safely.",ds400:"The DS400 has a 400 litre polyethylene tank on a metal panel, with all controls, the hose and the filling gun grouped in one compact unit, plus a battery box on the side.",ds500:"The DS500 combines a 500 litre polyethylene tank with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Shorter and wider than the DS600, with all controls grouped on a metal panel and a battery box on the side.",ds110:"The DS110 from the Cone series is the smallest and most flexible unit in the range: a 110-litre conical polyethylene tank on a metal base, with a 12 V diaphragm pump and flow up to 19 L/min. It runs from a 12 V battery, with no need for 220 V power in the field.",ds300:'The DS300 has a 300-litre polyethylene tank on a metal panel, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Controls, storage box and filling hose are all grouped in one compact unit.',ds200:'The DS200 has a 200-litre polyethylene tank on the same compact panel as the DS300, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. Ideal for smaller drones and everyday use.',ds200c:'The DS200 from the Cone series has a 200-litre conical polyethylene tank on a metal base, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. At just 50 kg it is the lightest unit in the range.',ds600:'The DS600 combines a 600-litre polyethylene tank with a 1 HP stainless centrifugal pump and flow up to 80 L/min. All controls sit on one metal panel, with the hose and filling gun at the side.',ds420:'The DS420 from the Cone series has a 420-litre conical polyethylene tank on a metal base, with a 1 HP stainless centrifugal pump and flow up to 80 L/min. At 80 kg it is the lighter of the two fully specified units.'},

includes:'Equipamiento de serie',intro:{pm20:"El External Pre-Mixer 20 L es una unidad autónoma para preparar el caldo de pulverización. Con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 60 L/min, los productos se disuelven con rapidez, los envases se enjuagan in situ y la mezcla lista se transfiere al sistema principal de forma limpia y segura.",ds400:"El DS400 cuenta con un depósito de polietileno de 400 litros sobre un panel metálico, con todos los mandos, la manguera y la pistola de llenado reunidos en una unidad compacta, además de una caja de batería en el lateral.",ds500:"El DS500 combina un depósito de polietileno de 500 litros con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 80 L/min. Más corto y ancho que el DS600, con todos los mandos agrupados en un panel metálico y una caja de batería en el lateral.",ds110:"El DS110 de la serie Cone es el equipo más pequeño y versátil de la gama: depósito cónico de polietileno de 110 litros sobre base metálica, con bomba de membrana de 12 V y caudal de hasta 19 L/min. Funciona con batería de 12 V, sin necesidad de corriente de 220 V en el campo.",ds300:'El DS300 tiene un depósito de polietileno de 300 litros sobre un panel metálico, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Mandos, caja de almacenaje y manguera de llenado reunidos en una unidad compacta.',ds200:'El DS200 tiene un depósito de polietileno de 200 litros en el mismo panel compacto que el DS300, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Ideal para drones más pequeños y uso diario.',ds200c:'El DS200 de la serie Cone tiene un depósito cónico de polietileno de 200 litros sobre base metálica, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Con solo 50 kg es el equipo más ligero de la gama.',ds600:'El DS600 combina un depósito de polietileno de 600 litros con una bomba centrífuga inoxidable de 1 HP y un caudal de hasta 80 L/min. Todos los mandos están en un panel metálico, con la manguera y la pistola de llenado en el lateral.',ds420:'El DS420 de la serie Cone tiene un depósito cónico de polietileno de 420 litros sobre base metálica, con bomba centrífuga inoxidable de 1 HP y caudal de hasta 80 L/min. Con 80 kg es el más ligero de los dos equipos con datos completos.'},

includes:'Equipaggiamento di serie',intro:{pm20:"L’External Pre-Mixer 20 L è un’unità autonoma per la preparazione della miscela da irrorare. Con una pompa centrifuga inox da 1 HP e una portata fino a 60 L/min, i prodotti si sciolgono rapidamente, i flaconi si lavano sul posto e la miscela pronta viene trasferita al sistema principale in modo pulito e sicuro.",ds400:"Il DS400 ha un serbatoio in polietilene da 400 litri su un pannello metallico, con tutti i comandi, la manichetta e la pistola di riempimento riuniti in un’unica unità compatta, oltre a un vano batteria laterale.",ds500:"Il DS500 abbina un serbatoio in polietilene da 500 litri a una pompa centrifuga inox da 1 HP con portata fino a 80 L/min. Più corto e più largo del DS600, con tutti i comandi raccolti su un pannello metallico e un vano batteria laterale.",ds110:"Il DS110 della serie Cone è l’unità più piccola e versatile della gamma: serbatoio conico in polietilene da 110 litri su base metallica, con pompa a membrana a 12 V e portata fino a 19 L/min. Funziona con batteria a 12 V, senza bisogno di corrente a 220 V in campo.",ds300:'Il DS300 ha un serbatoio in polietilene da 300 litri su un pannello metallico, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Comandi, vano portaoggetti e tubo di riempimento sono riuniti in un’unica unità compatta.',ds200:'Il DS200 ha un serbatoio in polietilene da 200 litri sullo stesso pannello compatto del DS300, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Ideale per droni più piccoli e uso quotidiano.',ds200c:'Il DS200 della serie Cone ha un serbatoio conico in polietilene da 200 litri su base metallica, con pompa centrifuga inox da 1 HP e portata fino a 80 L/min. Con soli 50 kg è l’unità più leggera della gamma.',ds600:'Il DS600 unisce un serbatoio in polietilene da 600 litri a una pompa centrifuga inox da 1 HP, con portata fino a 80 L/min. Tutti i comandi sono su un unico pannello metallico, con tubo e pistola di riempimento sul lato.',ds4 const PRIV={"el": {"title": "Πολιτική απορρήτου", "upd": "Τελευταία ενημέρωση: Νοέμβριος 2026", "intro": "Η παρούσα πολιτική εξηγεί ποια προσωπικά δεδομένα συλλέγουμε μέσω της ιστοσελίδας DroneSpray, για ποιο σκοπό, πόσο καιρό τα κρατάμε και ποια δικαιώματα έχετε σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (ΕΕ) 2016/679 (GDPR).", "s": [["Υπεύθυνος επεξεργασίας", ["FARMA Κυράτσας Γεωργικά Μηχανήματα Ε.Ε., 3ο χλμ. Λάρισας – Καρδίτσας, 41500 Λάρισα. Τηλέφωνο: 2410 622500 · Email: info@farma.com.gr."]], ["Ποια δεδομένα συλλέγουμε", ["Φόρμα επικοινωνίας: ονοματεπώνυμο, επιχείρηση, χώρα, τηλέφωνο, email, προϊόν ενδιαφέροντος και το μήνυμά σας.", "Αίτηση dealer: τα παραπάνω, καθώς και περιοχή, τύπος επιχείρησης και ιστοσελίδα (προαιρετικά).", "Newsletter: η διεύθυνση email σας και η συγκατάθεσή σας.", "WhatsApp: αν μας γράψετε μέσω WhatsApp, την επικοινωνία διαχειρίζεται η WhatsApp (Meta) σύμφωνα με τους δικούς της όρους."]], ["Για ποιο σκοπό και με ποια νομική βάση", ["Για να απαντήσουμε στο αίτημά σας, να σας στείλουμε προσφορά ή να οργανώσουμε επίδειξη (ενέργειες πριν από τη σύναψη σύμβασης, άρθρο 6 παρ. 1 β' GDPR).", "Για την αξιολόγηση αιτήσεων συνεργασίας (έννομο συμφέρον, άρθρο 6 παρ. 1 στ').", "Για την αποστολή newsletter, μόνο με τη συγκατάθεσή σας (άρθρο 6 παρ. 1 α'), την οποία μπορείτε να ανακαλέσετε οποτεδήποτε.", "Για στατιστικά επισκεψιμότητας μέσω Google Analytics, μόνο αν το αποδεχτείτε στο σχετικό μήνυμα (άρθρο 6 παρ. 1 α')."]], ["Πόσο καιρό κρατάμε τα δεδομένα", ["Τα αιτήματα επικοινωνίας και οι αιτήσεις dealer διατηρούνται έως 24 μήνες από την τελευταία επικοινωνία, εκτός αν προκύψει συνεργασία, οπότε ισχύουν οι νόμιμες υποχρεώσεις τήρησης.", "Το email του newsletter διατηρείται μέχρι να διαγραφείτε."]], ["Σε ποιους κοινοποιούνται", ["Δεν πουλάμε και δεν μεταβιβάζουμε τα δεδομένα σας σε τρίτους για διαφημιστικούς σκοπούς.", "Μπορεί να τα επεξεργάζονται για λογαριασμό μας πάροχοι φιλοξενίας, email και newsletter, δεσμευμένοι με σύμβαση επεξεργασίας.", "Αν ζητήσετε συνεργάτη στη χώρα σας, θα του διαβιβάσουμε τα στοιχεία επικοινωνίας σας μόνο για να σας εξυπηρετήσει.", "Αν αποδεχτείτε τα cookies στατιστικών, δεδομένα χρήσης της σελίδας επεξεργάζεται η Google Ireland Ltd (Google Analytics). Ενδέχεται να διαβιβαστούν στις ΗΠΑ, βάσει του Πλαισίου Προστασίας Δεδομένων ΕΕ–ΗΠΑ."]], ["Cookies", ["Η ιστοσελίδα δεν χρησιμοποιεί cookies διαφήμισης.", "Στη συσκευή σας αποθηκεύονται τοπικά η γλώσσα που επιλέξατε και η απάντησή σας στο μήνυμα για τα cookies.", "Μόνο αν πατήσετε «Αποδοχή», φορτώνεται το Google Tag Manager και μέσω αυτού το Google Analytics 4, που καταγράφει ανώνυμα στατιστικά, όπως σελίδες που επισκεφθήκατε, τύπο συσκευής και κατά προσέγγιση χώρα. Χρησιμοποιεί τα cookies _ga και _ga_*, που διατηρούνται έως 2 έτη. Αν πατήσετε «Απόρριψη», δεν φορτώνεται καθόλου.", "Μπορείτε να αλλάξετε την επιλογή σας οποτεδήποτε από τον σύνδεσμο «Ρυθμίσεις cookies» στο κάτω μέρος της σελίδας.", "Οι γραμματοσειρές φιλοξενούνται μαζί με την ιστοσελίδα· δεν γίνεται σύνδεση με το Google Fonts."]], ["Τα δικαιώματά σας", ["Έχετε δικαίωμα πρόσβασης, διόρθωσης, διαγραφής, περιορισμού, φορητότητας και εναντίωσης στην επεξεργασία, καθώς και ανάκλησης της συγκατάθεσής σας.", "Για να τα ασκήσετε, γράψτε μας στο info@farma.com.gr. Θα απαντήσουμε εντός ενός μηνός.", "Έχετε επίσης δικαίωμα να υποβάλετε καταγγελία στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (www.dpa.gr)."]], ["Ασφάλεια", ["Λαμβάνουμε εύλογα τεχνικά και οργανωτικά μέτρα για την προστασία των δεδομένων σας από απώλεια, κατάχρηση ή μη εξουσιοδοτημένη πρόσβαση."]], ["Αλλαγές", ["Μπορεί να ενημερώνουμε την πολιτική αυτή. Η ισχύουσα έκδοση είναι πάντα δημοσιευμένη σε αυτή τη σελίδα."]]]}, "en": {"title": "Privacy policy", "upd": "Last updated: November 2026", "intro": "This policy explains what personal data we collect through the DroneSpray website, why, how long we keep it and what rights you have under the General Data Protection Regulation (EU) 2016/679 (GDPR).", "s": [["Data controller", ["FARMA Kyratsas Agricultural Machinery L.P., 3rd km Larissa – Karditsa road, 41500 Larissa, Greece. Phone: +30 2410 622500 · Email: info@farma.com.gr."]], ["What data we collect", ["Contact form: full name, company, country, phone, email, product of interest and your message.", "Dealer application: the above, plus region, type of business and website (optional).", "Newsletter: your email address and your consent.", "WhatsApp: if you message us on WhatsApp, the conversation is handled by WhatsApp (Meta) under its own terms."]], ["Purpose and legal basis", ["To answer your request, send you a quote or arrange a demonstration (steps prior to a contract, Art. 6(1)(b) GDPR).", "To assess partnership applications (legitimate interest, Art. 6(1)(f)).", "To send the newsletter, only with your consent (Art. 6(1)(a)), which you can withdraw at any time.", "For visitor statistics through Google Analytics, only if you accept it in the cookie notice (Art. 6(1)(a))."]], ["How long we keep data", ["Contact requests and dealer applications are kept for up to 24 months after the last contact, unless a business relationship follows, in which case statutory retention periods apply.", "Your newsletter email is kept until you unsubscribe."]], ["Who we share it with", ["We do not sell or transfer your data to third parties for advertising.", "Hosting, email and newsletter providers may process it on our behalf under a data processing agreement.", "If you ask for a partner in your country, we pass your contact details to that partner only so they can serve you.", "If you accept statistics cookies, usage data is processed by Google Ireland Ltd (Google Analytics). It may be transferred to the USA under the EU–US Data Privacy Framework."]], ["Cookies", ["The website does not use advertising cookies.", "Your chosen language and your answer to the cookie notice are stored locally on your device.", "Only if you click “Accept” are Google Tag Manager and, through it, Google Analytics 4 loaded. Analytics records anonymous statistics such as pages visited, device type and approximate country, using the _ga and _ga_* cookies, which last up to 2 years. If you click “Decline”, it is not loaded at all.", "You can change your choice at any time with the “Cookie settings” link at the bottom of the page.", "Fonts are hosted together with the website; no connection is made to Google Fonts."]], ["Your rights", ["You have the right of access, rectification, erasure, restriction, portability and objection, and to withdraw your consent.", "To exercise them, email info@farma.com.gr. We will reply within one month.", "You may also lodge a complaint with the Hellenic Data Protection Authority (www.dpa.gr) or your local supervisory authority."]], ["Security", ["We take reasonable technical and organisational measures to protect your data against loss, misuse or unauthorised access."]], ["Changes", ["We may update this policy. The current version is always published on this page."]]]}};

function calcRun(){if(!$('calc'))return;const c=CALCT[lang]||CALCT.en,el=calcEl();
  const L=CS.brand===9?Math.max(5,+CS.custom||30):CS.l,tot=CS.area*CS.dose,refills=Math.ceil(tot/L),ok=m=>!(m[1]===110&&L>30);
  const rec=CALCM.find(m=>m[1]>=tot&&ok(m))||CALCM[CALCM.length-1];let m=CALCM.find(x=>x[0]===CS.pick);if(!m||!ok(m)){m=rec;CS.pick=''}
  const mine=m!==rec,batches=Math.ceil(tot/m[1]),secs=Math.round(L/m[2]*60),name=FULL[m[0]];
  $('calc-oa').innerHTML=calcNum(CS.area)+'<small>'+c.areaU+'</small>';$('calc-od').innerHTML=calcNum(CS.dose)+'<small>'+c.doseU+'</small>';
  $('calc-tot').innerHTML=calcNum(Math.round(tot))+'<small>L</small>';$('calc-ref').textContent=refills;
  $('calc-time').innerHTML=secs<60?secs+'<small>'+c.sec+'</small>':calcNum(secs/60)+'<small>'+c.min+'</small>';
  $('calc-k').textContent=mine?c.mine:c.rec;$('calc-n').textContent=name;
  $('calc-why').textContent=batches===1?c.one(calcNum(Math.round(tot)),m[1])+(m[4]&&!mine?' '+c.alt+FULL[m[4]]+'.':''):c.many(batches,m[1],m[1]===600);
  $('calc-chips').innerHTML=[[c.cTank,m[1]+' L'],[c.cFlow,m[2]+' L/min'],m[3]?[c.cKg,m[3]+' kg']:[c.cPow,'12 V']].map(([k,v])=>`<span>${v}</span>`).join('');
  const im=$('calc-img');if(im.dataset.id!==m[0]){const first=!im.dataset.id;im.dataset.id=m[0];im.alt='DroneSpray '+name;
    if(first)im.src=calcImg(m[0]);else{im.classList.add('swap');setTimeout(()=>{im.src=calcImg(m[0]);im.classList.remove('swap')},180)}}
  $('calc-bars').innerHTML=CALCM.map(x=>{const nm=FULL[x[0]].replace(' Cone','');const w=(x[1]/600*100).toFixed(1);
    if(!ok(x))return `<div class="calc-bar off"><b>${nm}</b><span class="tr"><s style="width:${w}%"></s></span><span class="nb">${c.small}</span></div>`;
    const b=Math.ceil(tot/x[1]),f=Math.min(1,tot/b/x[1]);
    return `<button type="button" class="calc-bar${x===m?' on':''}${x[0]===CS.pick?' pick':''}" data-cm="${x[0]}" aria-pressed="${x===m}"><b>${nm}</b><span class="tr"><s style="width:${w}%"><i style="width:${(f*100).toFixed(1)}%"></i></s></span><span class="nb">${b===1?c.f1:c.fN(b)}</span></button>`}).join('');
  const a=$('calc-cta');a.textContent=c.cta(name)+' →';a.dataset.product=m[0];
  const dr=CS.brand===9?c.other+' ('+L+' L)':CALCD[CS.brand][0]+' '+CS.drone+' ('+L+' L)';
  a.dataset.msg=c.msg(calcNum(CS.area)+' '+c.areaU,calcNum(CS.dose)+' '+c.doseU,dr,calcNum(Math.round(tot)),refills,name)}

document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#calc [data-cb],#calc [data-cd],#calc [data-cm],#calc-cta');if(!t)return;
  if(t.id==='calc-cta'){form.msg=t.dataset.msg||'';if(typeof track==='function')track('calc_quote',{model:t.dataset.product});return}

    document.querySelectorAll('#calc [data-cg]').forEach(g=>g.hidden=+g.dataset.cg!==CS.brand);$('calc').querySelector('.calc-cu').hidden=CS.brand!==9;
    if(CS.brand!==9){const cur=CALCD[CS.brand][1].find(d=>d[0]===CS.drone)||CALCD[CS.brand][1][0];CS.drone=cur[0];CS.l=cur[1];

  }else if(t.dataset.cd!==undefined){CS.drone=t.dataset.cd;CS.l=+t.dataset.l;document.querySelectorAll('#calc [data-cd]').forEach(x=>x.setAttribute('aria-pressed',String(x===t)))}
  else if(t.dataset.cm){CS.pick=CS.pick===t.dataset.cm?'':t.dataset.cm}

el:{nav:'Γιατί DroneSpray',title:'Γιατί DroneSpray: σταθμοί ανάδευσης για επαγγελματικό ψεκασμό με drone',eye:'Το πλεονέκτημα DroneSpray',h1:'Σχεδιασμένο για αποδοτικότητα. Φτιαγμένο για επαγγελματικό ψεκασμό με drone.',lead:'Ο σύγχρονος ψεκασμός με drone χρειάζεται κάτι περισσότερο από μια δεξαμενή νερού και μια αντλία. Χρειάζεται ταχύτητα, ακρίβεια, αξιοπιστία και μια οργανωμένη ροή εργασίας που αντέχει στο χωράφι και στην εντατική καθημερινή χρήση.',lead2:'Το DroneSpray αναπτύχθηκε ακριβώς γι’ αυτό. Συνδυάζει πάνω από 25 χρόνια εμπειρίας στα ψεκαστικά μηχανήματα με εξειδικευμένο σχεδιασμό για γεωργικά drone: η προετοιμασία, η ανάδευση, το γέμισμα και η έκπλυση γίνονται μία ενιαία, αποδοτική διαδικασία.',fh:'Τι κερδίζετε',
f:[['Γρήγορο γέμισμα, υψηλή απόδοση','Στην καρδιά κάθε συστήματος βρίσκεται μια φυγοκεντρική αντλία υψηλής απόδοσης. Η μεγάλη παροχή μειώνει τον χρόνο ανεφοδιασμού του drone, περιορίζει τις νεκρές ώρες ανάμεσα στις πτήσεις και αυξάνει τη δουλειά που βγαίνει κάθε μέρα.'],['Συνεχής ανάδευση, ομοιόμορφο μίγμα','Το ενσωματωμένο σύστημα ανάδευσης κρατά το υγρό σε συνεχή κυκλοφορία μέσα στη δεξαμενή, για ομοιόμορφο ψεκαστικό διάλυμα χωρίς ιζήματα, σε όλη τη διάρκεια της προετοιμασίας και του γεμίσματος.'],['Εύκολη ενσωμάτωση σκευασμάτων','Ειδικό σύστημα ενσωμάτωσης για την προσθήκη και διάλυση των σκευασμάτων στη δεξαμενή. Η διαδικασία γίνεται πιο ελεγχόμενη και πρακτική, για υγρά και για σκόνες, σύμφωνα με τις οδηγίες ανάμιξης κάθε σκευάσματος.'],['Ολοκληρωμένη έκπλυση','Πλύσιμο φιαλών σκευασμάτων και έκπλυση της δεξαμενής, ενσωματωμένα στο μηχάνημα. Λιγότερες χειροκίνητες εργασίες, σωστότερος χειρισμός των σκευασμάτων και πιο καθαρός χώρος εργασίας.'],['Για καθημερινή επαγγελματική χρήση','Ανθεκτικά εξαρτήματα, στιβαρή κατασκευή, δεξαμενή πολυαιθυλενίου υψηλής ποιότητας, ανοξείδωτη φυγοκεντρική αντλία και προσεκτικά σχεδιασμένες σωληνώσεις και συνδέσεις. Κάθε μονάδα περνά ποιοτικό έλεγχο και δοκιμή λειτουργίας πριν την παράδοση.'],['Όλη η δουλειά σε ένα σύστημα','Γέμισμα, ανάδευση, ενσωμάτωση σκευασμάτων, φιλτράρισμα, έλεγχος πίεσης και έκπλυση, σε ένα ενιαίο σύστημα. Αντί για αυτοσχέδιο εξοπλισμό και χρονοβόρες χειροκίνητες διαδικασίες: λιγότερος χαμένος χρόνος και καλύτερη αξιοποίηση του drone, του προσωπικού και των ωρών εργασίας.'],['Ευρωπαϊκός σχεδιασμός, επαγγελματικά πρότυπα','Σχεδιασμένο και κατασκευασμένο στην Ελλάδα, το DroneSpray συνδυάζει την εμπειρία στα γεωργικά μηχανήματα με εξειδικευμένες λύσεις για τον ψεκασμό με drone. Όλα τα συστήματα έχουν πιστοποίηση CE και UKCA και εγγύηση 1 έτους.']],
ch:'Κάτι περισσότερο από εξοπλισμός. Ένα επαγγελματικό πλεονέκτημα.',cp:'Το DroneSpray δεν είναι απλώς ένας σταθμός γεμίσματος. Είναι ένα σύστημα σχεδιασμένο ειδικά για να βελτιώνει τον τρόπο που οι επαγγελματίες ετοιμάζουν, ανεφοδιάζουν και οργανώνουν τους ψεκασμούς τους.',tri:['Λιγότεροι νεκροί χρόνοι.','Περισσότερη απόδοση.','Καλύτερη οργάνωση.'],b1:'Ζητήστε προσφορά',b2:'Δείτε τα μοντέλα'},
en:{nav:'Why DroneSpray',title:'Why DroneSpray: pre-mixing stations for professional spray drones',eye:'The DroneSpray advantage',h1:'Engineered for efficiency. Built for professional drone operations.',lead:'Modern agricultural drone operations demand more than a water tank and a pump. They require speed, precision, reliability and a well-organized workflow that can handle demanding field conditions and intensive daily use.',lead2:'DroneSpray was developed to meet these requirements. It combines more than 25 years of experience in spraying technology with specialized engineering for agricultural drones, turning preparation, agitation, filling and rinsing into one integrated, efficient workflow.',fh:'What you gain',
f:[['High-performance filling','At the core of every system is a high-performance centrifugal pump. High flow rates cut the time needed to refill the drone, minimize downtime between flights and help operators get more work done every day.'],['Continuous agitation, homogeneous mix','The integrated agitation system keeps the liquid circulating in the tank, for a uniform spray solution without sedimentation throughout preparation and filling.'],['Integrated product incorporation','A dedicated incorporation system lets operators add and disperse products into the tank efficiently. It makes handling liquid and powder formulations more controlled and practical, according to their mixing instructions.'],['Complete rinsing solution','Bottle rinsing and tank rinsing are built into the machine. Fewer manual operations, better product handling and a cleaner working environment.'],['Built for daily professional use','Durable components, robust construction, a high-quality polyethylene tank, a stainless-steel centrifugal pump and carefully designed piping and connections. Every unit undergoes quality control and operational testing before delivery.'],['One complete, organized workflow','Filling, agitation, product incorporation, filtration, pressure monitoring and rinsing in one dedicated system. Instead of improvised equipment and time-consuming manual work: less downtime and better use of your drone, your team and your working hours.'],['European engineering, professional standards','Designed and manufactured in Greece, DroneSpray combines agricultural machinery expertise with specialized solutions for drone spraying. All systems come with CE and UKCA conformity and a 1-year warranty.']],
ch:'More than equipment. A professional advantage.',cp:'DroneSpray is not simply a filling station. It is a purpose-built system engineered to improve the way professional drone operators prepare, refill and manage their spraying operations.',tri:['Less downtime.','More efficiency.','A better-organized operation.'],b1:'Request a quote',b2:'See the models'},
es:{nav:'Por qué DroneSpray',title:'Por qué DroneSpray: estaciones de premezcla para drones de pulverización profesionales',eye:'La ventaja DroneSpray',h1:'Diseñado para la eficiencia. Construido para operaciones profesionales con drones.',lead:'Las operaciones agrícolas con drones exigen algo más que un depósito de agua y una bomba. Requieren rapidez, precisión, fiabilidad y un flujo de trabajo bien organizado, capaz de soportar las exigencias del campo y un uso diario intensivo.',lead2:'DroneSpray se ha desarrollado para responder a estas necesidades. Combina más de 25 años de experiencia en tecnología de pulverización con una ingeniería especializada para drones agrícolas: la preparación, la agitación, el llenado y el enjuague se convierten en un único proceso integrado y eficiente.',fh:'Lo que gana',
f:[['Llenado de alto rendimiento','En el corazón de cada sistema hay una bomba centrífuga de alto rendimiento. Su elevado caudal reduce el tiempo de recarga del dron, minimiza los tiempos muertos entre vuelos y le permite trabajar más cada día.'],['Agitación continua, mezcla homogénea','El sistema de agitación integrado mantiene el líquido en circulación continua dentro del depósito, para una mezcla uniforme y sin sedimentos durante toda la preparación y el llenado.'],['Incorporación integrada de productos','Un sistema de incorporación específico permite añadir y dispersar los productos en el depósito de forma eficiente. El manejo de formulaciones líquidas y en polvo resulta más controlado y práctico, según sus instrucciones de mezcla.'],['Solución completa de enjuague','El enjuague de envases y del depósito está integrado en la máquina. Menos operaciones manuales, mejor manipulación de los productos y un entorno de trabajo más limpio.'],['Para el uso profesional diario','Componentes duraderos, construcción robusta, depósito de polietileno de alta calidad, bomba centrífuga de acero inoxidable y tuberías y conexiones cuidadosamente diseñadas. Cada unidad pasa un control de calidad y una prueba de funcionamiento antes de la entrega.'],['Todo el trabajo en un solo sistema','Llenado, agitación, incorporación de productos, filtración, control de presión y enjuague en un único sistema dedicado. En lugar de equipos improvisados y laboriosos procesos manuales: menos tiempos muertos y un mejor aprovechamiento del dron, del personal y de las horas de trabajo.'],['Ingeniería europea, estándares profesionales','Diseñado y fabricado en Grecia, DroneSpray combina la experiencia en maquinaria agrícola con soluciones especializadas para la pulverización con drones. Todos los sistemas cuentan con conformidad CE y UKCA y 1 año de garantía.']],
ch:'Más que un equipo. Una ventaja profesional.',cp:'DroneSpray no es simplemente una estación de llenado. Es un sistema diseñado específicamente para mejorar la forma en que los operadores profesionales preparan, recargan y gestionan sus trabajos de pulverización.',tri:['Menos tiempos muertos.','Más eficiencia.','Una operación mejor organizada.'],b1:'Solicitar presupuesto',b2:'Ver los modelos'},
it:{nav:'Perché DroneSpray',title:'Perché DroneSpray: stazioni di premiscelazione per droni irroratori professionali',eye:'Il vantaggio DroneSpray',h1:'Progettato per l’efficienza. Costruito per le operazioni professionali con i droni.',lead:'Le operazioni agricole con i droni richiedono più di un serbatoio d’acqua e una pompa. Servono velocità, precisione, affidabilità e un flusso di lavoro ben organizzato, in grado di reggere le condizioni del campo e un uso quotidiano intensivo.',lead2:'DroneSpray è nato per rispondere a queste esigenze. Unisce oltre 25 anni di esperienza nella tecnologia di irrorazione a una progettazione specifica per i droni agricoli: preparazione, agitazione, riempimento e risciacquo diventano un unico processo integrato ed efficiente.',fh:'Cosa ottenete',
f:[['Riempimento ad alte prestazioni','Al centro di ogni sistema c’è una pompa centrifuga ad alte prestazioni. L’elevata portata riduce i tempi di rifornimento del drone, limita i tempi morti tra un volo e l’altro e aumenta il lavoro svolto ogni giorno.'],['Agitazione continua, miscela omogenea','Il sistema di agitazione integrato mantiene il liquido in circolazione continua nel serbatoio, per una miscela uniforme e senza sedimenti durante tutta la preparazione e il riempimento.'],['Incorporazione integrata dei prodotti','Un sistema di incorporazione dedicato permette di aggiungere e disperdere i prodotti nel serbatoio in modo efficiente. La gestione di formulazioni liquide e in polvere diventa più controllata e pratica, secondo le rispettive istruzioni di miscelazione.'],['Soluzione completa di risciacquo','Il risciacquo dei flaconi e del serbatoio è integrato nella macchina. Meno operazioni manuali, una migliore gestione dei prodotti e un ambiente di lavoro più pulito.'],['Per l’uso professionale quotidiano','Componenti durevoli, costruzione robusta, serbatoio in polietilene di alta qualità, pompa centrifuga in acciaio inox e tubazioni e raccordi progettati con cura. Ogni unità viene sottoposta a controllo qualità e collaudo prima della consegna.'],['Tutto il lavoro in un unico sistema','Riempimento, agitazione, incorporazione dei prodotti, filtrazione, controllo della pressione e risciacquo in un unico sistema dedicato. Invece di attrezzature improvvisate e lunghe procedure manuali: meno tempi morti e un migliore utilizzo del drone, del personale e delle ore di lavoro.'],['Progettazione europea, standard professionali','Progettato e prodotto in Grecia, DroneSpray unisce l’esperienza nelle macchine agricole a soluzioni specifiche per l’irrorazione con i droni. Tutti i sistemi sono conformi CE e UKCA e hanno 1 anno di garanzia.']],
ch:'Più di un’attrezzatura. Un vantaggio professionale.',cp:'DroneSpray non è semplicemente una stazione di riempimento. È un sistema progettato appositamente per migliorare il modo in cui gli operatori professionali preparano, riforniscono e gestiscono i loro trattamenti.',tri:['Meno tempi morti.','Più efficienza.','Un lavoro meglio organizzato.'],b1:'Richiedi un preventivo',b2:'Vedi i modelli'},
fr:{nav:'Pourquoi DroneSpray',title:'Pourquoi DroneSpray : stations de prémélange pour drones de pulvérisation professionnels',eye:'L’avantage DroneSpray',h1:'Conçu pour l’efficacité. Construit pour les opérations professionnelles par drone.',lead:'Les opérations agricoles par drone exigent plus qu’une cuve d’eau et une pompe. Elles demandent rapidité, précision, fiabilité et une organisation du travail capable de supporter les conditions du terrain et une utilisation quotidienne intensive.',lead2:'DroneSpray a été développé pour répondre à ces exigences. Il associe plus de 25 ans d’expérience en technologie de pulvérisation à une conception spécialisée pour les drones agricoles : la préparation, l’agitation, le remplissage et le rinçage ne forment plus qu’un seul processus intégré et efficace.',fh:'Ce que vous gagnez',
f:[['Remplissage haute performance','Au cœur de chaque système se trouve une pompe centrifuge haute performance. Son débit élevé réduit le temps de remplissage du drone, limite les temps morts entre les vols et augmente le travail réalisé chaque jour.'],['Agitation continue, bouillie homogène','Le système d’agitation intégré maintient le liquide en circulation continue dans la cuve, pour une bouillie homogène et sans dépôt pendant toute la préparation et le remplissage.'],['Incorporation intégrée des produits','Un système d’incorporation dédié permet d’ajouter et de disperser efficacement les produits dans la cuve. La manipulation des formulations liquides et en poudre devient plus maîtrisée et plus pratique, selon leurs instructions de mélange.'],['Solution de rinçage complète','Le rinçage des bidons et de la cuve est intégré à la machine. Moins d’opérations manuelles, une meilleure manipulation des produits et un environnement de travail plus propre.'],['Pour un usage professionnel quotidien','Composants durables, construction robuste, cuve en polyéthylène de haute qualité, pompe centrifuge en inox et tuyauteries et raccords soigneusement conçus. Chaque unité passe un contrôle qualité et un essai de fonctionnement avant la livraison.'],['Tout le travail dans un seul système','Remplissage, agitation, incorporation des produits, filtration, contrôle de la pression et rinçage dans un seul système dédié. Au lieu d’un équipement improvisé et de longues opérations manuelles : moins de temps morts et une meilleure utilisation du drone, du personnel et des heures de travail.'],['Conception européenne, standards professionnels','Conçu et fabriqué en Grèce, DroneSpray associe l’expertise en machinisme agricole à des solutions spécialisées pour la pulvérisation par drone. Tous les systèmes sont conformes CE et UKCA et garantis 1 an.']],
ch:'Plus qu’un équipement. Un avantage professionnel.',cp:'DroneSpray n’est pas une simple station de remplissage. C’est un système conçu spécialement pour améliorer la façon dont les opérateurs professionnels préparent, remplissent et organisent leurs chantiers de pulvérisation.',tri:['Moins de temps morts.','Plus d’efficacité.','Un chantier mieux organisé.'],b1:'Demander un devis',b2:'Voir les modèles'},
de:{nav:'Warum DroneSpray',title:'Warum DroneSpray: Mischstationen für den professionellen Drohneneinsatz',eye:'Der DroneSpray-Vorteil',h1:'Entwickelt für Effizienz. Gebaut für den professionellen Drohneneinsatz.',lead:'Moderne landwirtschaftliche Drohneneinsätze brauchen mehr als einen Wassertank und eine Pumpe. Sie verlangen Schnelligkeit, Präzision, Zuverlässigkeit und einen gut organisierten Arbeitsablauf, der den Bedingungen auf dem Feld und dem intensiven täglichen Einsatz standhält.',lead2:'DroneSpray wurde genau dafür entwickelt. Es verbindet mehr als 25 Jahre Erfahrung in der Spritztechnik mit spezialisierter Konstruktion für Agrardrohnen: Vorbereiten, Rühren, Befüllen und Spülen werden zu einem einzigen, effizienten Arbeitsablauf.',fh:'Ihre Vorteile',
f:[['Leistungsstarkes Befüllen','Herzstück jedes Systems ist eine leistungsstarke Kreiselpumpe. Die hohe Fördermenge verkürzt das Nachfüllen der Drohne, reduziert Stillstandzeiten zwischen den Flügen und steigert die tägliche Arbeitsleistung.'],['Ständiges Rühren, homogene Brühe','Das integrierte Rührwerk hält die Flüssigkeit im Tank ständig in Bewegung – für eine gleichmäßige Spritzbrühe ohne Ablagerungen während der gesamten Vorbereitung und Befüllung.'],['Integrierte Mitteleinspülung','Ein eigenes Einspülsystem ermöglicht das effiziente Zugeben und Verteilen der Mittel im Tank. Flüssige und pulverförmige Formulierungen lassen sich kontrollierter und praktischer handhaben, gemäß ihren Mischanweisungen.'],['Komplette Spüllösung','Kanister- und Tankspülung sind direkt in die Maschine integriert. Weniger Handarbeit, sicherer Umgang mit den Mitteln und ein saubererer Arbeitsplatz.'],['Für den täglichen Profi-Einsatz','Langlebige Komponenten, robuste Bauweise, hochwertiger Polyethylentank, Edelstahl-Kreiselpumpe sowie sorgfältig konstruierte Leitungen und Anschlüsse. Jede Einheit durchläuft vor der Auslieferung eine Qualitätskontrolle und einen Funktionstest.'],['Die ganze Arbeit in einem System','Befüllen, Rühren, Einspülen, Filtern, Drucküberwachung und Spülen in einem einzigen, dafür gebauten System. Statt improvisierter Ausrüstung und zeitraubender Handarbeit: weniger Stillstand und eine bessere Nutzung von Drohne, Personal und Arbeitszeit.'],['Europäische Konstruktion, professionelle Standards','In Griechenland entwickelt und hergestellt, verbindet DroneSpray Erfahrung im Landmaschinenbau mit spezialisierten Lösungen für das Spritzen mit Drohnen. Alle Systeme sind CE- und UKCA-konform und haben 1 Jahr Garantie.']],
ch:'Mehr als Ausrüstung. Ein professioneller Vorteil.',cp:'DroneSpray ist nicht einfach eine Befüllstation. Es ist ein eigens entwickeltes System, das verbessert, wie professionelle Drohnenpiloten ihre Spritzeinsätze vorbereiten, nachfüllen und organisieren.',tri:['Weniger Stillstand.','Mehr Effizienz.','Besser organisierte Einsätze.'],b1:'Angebot anfordern',b2:'Modelle ansehen'},
ro:{nav:'De ce DroneSpray',title:'De ce DroneSpray: stații de premixare pentru drone de stropit profesionale',eye:'Avantajul DroneSpray',h1:'Proiectat pentru eficiență. Construit pentru operațiuni profesionale cu drone.',lead:'Operațiunile agricole moderne cu drone cer mai mult decât un rezervor de apă și o pompă. Ele cer viteză, precizie, fiabilitate și un flux de lucru bine organizat, care să facă față condițiilor din câmp și utilizării zilnice intense.',lead2:'DroneSpray a fost dezvoltat pentru a răspunde acestor cerințe. Combină peste 25 de ani de experiență în tehnologia de stropire cu o proiectare specializată pentru dronele agricole: pregătirea, amestecarea, umplerea și clătirea devin un singur proces integrat și eficient.',fh:'Ce câștigați',
f:[['Umplere de înaltă performanță','În centrul fiecărui sistem se află o pompă centrifugă de înaltă performanță. Debitul mare reduce timpul de realimentare a dronei, scurtează pauzele dintre zboruri și crește volumul de lucru realizat zilnic.'],['Amestecare continuă, soluție omogenă','Sistemul de amestecare integrat menține lichidul în circulație continuă în rezervor, pentru o soluție uniformă, fără depuneri, pe toată durata pregătirii și umplerii.'],['Încorporarea integrată a produselor','Un sistem dedicat de încorporare permite adăugarea și dispersarea eficientă a produselor în rezervor. Manipularea formulărilor lichide și sub formă de pulbere devine mai controlată și mai practică, conform instrucțiunilor de amestecare.'],['Soluție completă de clătire','Clătirea flacoanelor și a rezervorului este integrată în utilaj. Mai puține operațiuni manuale, o manipulare mai bună a produselor și un loc de muncă mai curat.'],['Pentru utilizare profesională zilnică','Componente durabile, construcție robustă, rezervor din polietilenă de înaltă calitate, pompă centrifugă din inox și țevi și racorduri proiectate cu grijă. Fiecare unitate trece printr-un control de calitate și un test de funcționare înainte de livrare.'],['Toată munca într-un singur sistem','Umplere, amestecare, încorporarea produselor, filtrare, controlul presiunii și clătire într-un singur sistem dedicat. În locul echipamentelor improvizate și al operațiunilor manuale îndelungate: mai puțin timp pierdut și o utilizare mai bună a dronei, a personalului și a orelor de lucru.'],['Proiectare europeană, standarde profesionale','Proiectat și fabricat în Grecia, DroneSpray combină experiența în utilaje agricole cu soluții specializate pentru stropirea cu drone. Toate sistemele au conformitate CE și UKCA și 1 an garanție.']],
ch:'Mai mult decât un echipament. Un avantaj profesional.',cp:'DroneSpray nu este doar o stație de umplere. Este un sistem conceput special pentru a îmbunătăți modul în care operatorii profesioniști pregătesc, realimentează și își organizează lucrările de stropire.',tri:['Mai puțin timp pierdut.','Mai multă eficiență.','O activitate mai bine organizată.'],b1:'Solicitați o ofertă',b2:'Vedeți modelele'}};

includes:'Serienausstattung',intro:{pm20:'Der externe Vormischer 20 L ist ein eigenständiges Gerät zum Ansetzen der Spritzbrühe. Mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 60 L/min Fördermenge lösen sich die Mittel schnell auf, Kanister werden direkt gespült und die fertige Mischung sauber und sicher in das Hauptsystem gefördert.',ds400:'Der DS400 hat einen 400-Liter-Polyethylentank auf einem Metallpaneel, mit allen Bedienelementen, Schlauch und Füllpistole in einer kompakten Einheit sowie einem seitlichen Batteriekasten.',ds500:'Der DS500 kombiniert einen 500-Liter-Polyethylentank mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Kürzer und breiter als der DS600, mit allen Bedienelementen auf einem Metallpaneel und einem seitlichen Batteriekasten.',ds110:'Der DS110 aus der Cone-Serie ist das kleinste und flexibelste Gerät der Reihe: ein konischer 110-Liter-Polyethylentank auf einem Metallgestell, mit 12-V-Membranpumpe und bis zu 19 L/min Fördermenge. Er läuft an einer 12-V-Batterie, ganz ohne 220-V-Strom auf dem Feld.',ds300:'Der DS300 hat einen 300-Liter-Polyethylentank auf einem Metallpaneel, mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Bedienelemente, Staubox und Füllschlauch sind in einer kompakten Einheit zusammengefasst.',ds200:'Der DS200 hat einen 200-Liter-Polyethylentank auf demselben kompakten Paneel wie der DS300, mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Ideal für kleinere Drohnen und den täglichen Einsatz.',ds200c:'Der DS200 aus der Cone-Serie hat einen konischen 200-Liter-Polyethylentank auf einem Metallgestell, mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Mit nur 50 kg ist er das leichteste Gerät der Reihe.',ds600:'Der DS600 kombiniert einen 600-Liter-Polyethylentank mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Alle Bedienelemente sitzen auf einem Metallpaneel, Schlauch und Füllpistole an der Seite.',ds420:'Der DS420 aus der Cone-Serie hat einen konischen 420-Liter-Polyethylentank auf einem Metallgestell, mit einer 1-PS-Edelstahl-Kreiselpumpe und bis zu 80 L/min Fördermenge. Mit 80 kg ist er das leichtere der beiden vollständig spezifizierten Geräte.'},

PRIV.de={title:'Datenschutzerklärung',upd:'Stand: November 2026',intro:'Diese Erklärung beschreibt, welche personenbezogenen Daten wir über die DroneSpray-Website erheben, zu welchem Zweck, wie lange wir sie speichern und welche Rechte Sie nach der Datenschutz-Grundverordnung (EU) 2016/679 (DSGVO) haben.',s:[
['Verantwortlicher',['FARMA Kyratsas Agricultural Machinery L.P. (griechische Kommanditgesellschaft, E.E.), 3. km Straße Larissa – Karditsa, 41500 Larissa, Griechenland. Telefon: +30 2410 622500 · E-Mail: info@farma.com.gr.']],
['Welche Daten wir erheben',['Kontaktformular: Vor- und Nachname, Unternehmen, Land, Telefon, E-Mail, gewünschtes Produkt und Ihre Nachricht.','Händlerbewerbung: die oben genannten Daten sowie Region, Art des Unternehmens und Website (optional).','Newsletter: Ihre E-Mail-Adresse und Ihre Einwilligung.','WhatsApp: Wenn Sie uns über WhatsApp schreiben, wird die Unterhaltung von WhatsApp (Meta) nach dessen eigenen Bedingungen verarbeitet.']],
['Zweck und Rechtsgrundlage',['Zur Beantwortung Ihrer Anfrage, zur Erstellung eines Angebots oder zur Vereinbarung einer Vorführung (vorvertragliche Maßnahmen, Art. 6 Abs. 1 lit. b DSGVO).','Zur Prüfung von Partnerschaftsbewerbungen (berechtigtes Interesse, Art. 6 Abs. 1 lit. f DSGVO).','Für den Versand des Newsletters, nur mit Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO), die Sie jederzeit widerrufen können.','Für Besucherstatistiken über Google Analytics, nur wenn Sie dies im Cookie-Hinweis akzeptieren (Art. 6 Abs. 1 lit. a DSGVO).']],
['Wie lange wir Daten speichern',['Kontaktanfragen und Händlerbewerbungen werden bis zu 24 Monate nach dem letzten Kontakt gespeichert, es sei denn, es entsteht eine Geschäftsbeziehung; dann gelten die gesetzlichen Aufbewahrungsfristen.','Ihre E-Mail-Adresse für den Newsletter wird gespeichert, bis Sie sich abmelden.']],
['An wen wir Daten weitergeben',['Wir verkaufen Ihre Daten nicht und geben sie nicht zu Werbezwecken an Dritte weiter.','Anbieter für Hosting, E-Mail und Newsletter können sie in unserem Auftrag auf Grundlage eines Auftragsverarbeitungsvertrags verarbeiten.','Wenn Sie nach einem Partner in Ihrem Land fragen, geben wir Ihre Kontaktdaten nur an diesen Partner weiter, damit er Sie betreuen kann.','Wenn Sie Statistik-Cookies akzeptieren, werden Nutzungsdaten von Google Ireland Ltd (Google Analytics) verarbeitet. Sie können auf Grundlage des EU-US Data Privacy Framework in die USA übermittelt werden.']],
['Cookies',['Die Website verwendet keine Werbe-Cookies.','Ihre gewählte Sprache und Ihre Antwort auf den Cookie-Hinweis werden lokal auf Ihrem Gerät gespeichert.','Nur wenn Sie auf „Akzeptieren“ klicken, werden Google Tag Manager und darüber Google Analytics 4 geladen. Analytics erfasst anonyme Statistiken wie besuchte Seiten, Gerätetyp und ungefähres Land mithilfe der Cookies _ga und _ga_*, die bis zu 2 Jahre gültig sind. Wenn Sie auf „Ablehnen“ klicken, wird es überhaupt nicht geladen.','Sie können Ihre Wahl jederzeit über den Link „Cookie-Einstellungen“ unten auf der Seite ändern.','Die Schriftarten werden zusammen mit der Website gehostet; es wird keine Verbindung zu Google Fonts hergestellt.']],

tare sunt pe lateral.',ds420:'DS420 din seria Cone are un rezervor conic din polietilenă de 420 de litri pe cadru metalic, cu o pompă centrifugă din inox de 1 CP și un debit de până la 80 L/min. Cu 80 kg, este cel mai ușor dintre cele două utilaje cu date tehnice complete.'},

['Operatorul de date',['FARMA Kyratsas Agricultural Machinery L.P. (societate în comandită grecească, E.E.), km 3 drumul Larissa – Karditsa, 41500 Larissa, Grecia. Telefon: +30 2410 622500 · E-mail: info@farma.com.gr.']],
['Ce date colectăm',['Formularul de contact: nume și prenume, firmă, țară, telefon, e-mail, produsul care vă interesează și mesajul dumneavoastră.','Cererea de dealer: datele de mai sus, plus regiunea, tipul firmei și site-ul web (opțional).','Newsletter: adresa de e-mail și consimțământul dumneavoastră.','WhatsApp: dacă ne scrieți pe WhatsApp, conversația este prelucrată de WhatsApp (Meta) conform propriilor condiții.']],
['Scopul și temeiul juridic',['Pentru a răspunde solicitării dumneavoastră, a pregăti o ofertă sau a programa o demonstrație (măsuri precontractuale, art. 6 alin. (1) lit. (b) GDPR).','Pentru a evalua cererile de parteneriat (interes legitim, art. 6 alin. (1) lit. (f) GDPR).','Pentru trimiterea newsletterului, numai cu consimțământul dumneavoastră (art. 6 alin. (1) lit. (a) GDPR), pe care îl puteți retrage oricând.','Pentru statistici privind vizitatorii prin Google Analytics, numai dacă le acceptați în mesajul despre cookie-uri (art. 6 alin. (1) lit. (a) GDPR).']],
['Cât timp păstrăm datele',['Solicitările de contact și cererile de dealer se păstrează până la 24 de luni de la ultimul contact, cu excepția cazului în care se încheie o colaborare; atunci se aplică termenele legale de păstrare.','Adresa de e-mail pentru newsletter se păstrează până când vă dezabonați.']],
['Cui transmitem datele',['Nu vindem datele dumneavoastră și nu le transmitem terților în scopuri de marketing.','Furnizorii de găzduire, e-mail și newsletter le pot prelucra în numele nostru, pe baza unui contract de prelucrare a datelor.','Dacă solicitați un partener din țara dumneavoastră, transmitem datele de contact numai acelui partener, pentru a vă putea servi.','Dacă acceptați cookie-urile de statistică, datele de utilizare sunt prelucrate de Google Ireland Ltd (Google Analytics). Acestea pot fi transferate în SUA în baza Cadrului UE-SUA privind confidențialitatea datelor.']],
['Cookie-uri',['Site-ul nu folosește cookie-uri de publicitate.','Limba aleasă și răspunsul dumneavoastră la mesajul despre cookie-uri sunt salvate local, pe dispozitivul dumneavoastră.','Numai dacă apăsați „Accept” se încarcă Google Tag Manager și, prin acesta, Google Analytics 4. Analytics colectează statistici anonime, precum paginile vizitate, tipul dispozitivului și țara aproximativă, folosind cookie-urile _ga și _ga_*, valabile până la 2 ani. Dacă apăsați „Refuz”, nu se încarcă deloc.','Vă puteți schimba oricând alegerea din linkul „Setări cookie-uri” din partea de jos a paginii.','Fonturile sunt găzduite împreună cu site-ul; nu se face nicio conexiune la Google Fonts.']],
['Drepturile dumneavoastră',['Aveți dreptul de acces, rectificare, ștergere, restricționare a prelucrării, portabilitate și opoziție, precum și dreptul de a vă retrage consimțământul.','Pentru a vă exercita aceste drepturi, scrieți-ne la info@farma.com.gr. Răspundem în termen de o lună.','Puteți depune și o plângere la Autoritatea elenă pentru protecția datelor (www.dpa.gr) sau la autoritatea de supraveghere din țara dumneavoastră (în România, ANSPDCP – www.dataprotection.ro).']],
['Securitate',['Luăm măsuri tehnice și organizatorice adecvate pentru a vă proteja datele împotriva pierderii, utilizării abuzive sau accesului neautorizat.']],
